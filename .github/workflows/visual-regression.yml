name: Visual Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: Playwright screenshot comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Require committed Linux baseline
        run: test -f e2e/visual-baselines/visual/home.spec.ts-snapshots/home-chromium-linux.png
      - name: Compare screenshots (1% maximum difference)
        run: npx playwright test e2e/visual --project=chromium
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload visual comparison report and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  storybook:
    name: Storybook and Chromatic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build Storybook
        run: npm run build-storybook
      - name: Publish Chromatic comparison
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::notice::Chromatic publication requires the maintainer's project token; the Playwright gate still runs."
            exit 0
          fi
          npx chromatic --project-token="$CHROMATIC_PROJECT_TOKEN" --storybook-build-dir=storybook-static
      - name: Upload Storybook build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-storybook
          path: storybook-static/
          if-no-files-found: warn
          retention-days: 14
